awesome:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - index.qmd
          - entries/**/*
          - assets/screenshots/**/*

docs:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - AGENTS.md
          - ABOUT.md
          - CODE_OF_CONDUCT.md
          - CONTRIBUTING.md
          - CITATION.cff
          - LICENSE*
          - SECURITY.md
          - _quarto.yml
          - package.json
          - package-lock.json
          - scripts/**/*
          - partials/**/*
          - .npmrc
          - .prettierrc
          - .prettierignore
          - .gitattributes
          - .gitignore

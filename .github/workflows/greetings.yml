name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Hi there! Thanks for opening your first issue!'
          pr-message: 'Hi there! Thanks for opening your first pull request! Please make sure it references the issue where your proposal was discussed and accepted, as required by CONTRIBUTING.md.'

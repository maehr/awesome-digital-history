name: Greetings

# This workflow only reads event metadata and posts greetings; it never checks
# out or executes pull request code.
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: 'Hi there! Thanks for opening your first issue!'
          pr_message: 'Hi there! Thanks for opening your first pull request! Please make sure it references the issue where your proposal was discussed and accepted, as required by CONTRIBUTING.md.'

name: Greetings

# This workflow only reads event metadata and posts greetings; it never checks
# out or executes pull request code.
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thank you for your first issue.
            To add a new resource, wait for the `approved` label before you open a pull request.
            Read the [contribution guidelines](https://github.com/maehr/awesome-digital-history/blob/main/CONTRIBUTING.md) for the process.
          pr_message: |
            Thank you for your first pull request.
            A pull request that adds a new entry must link an Addition issue with the `approved` label.
            Edits, broken-link fixes, and removals do not need an issue.
            Read the [contribution guidelines](https://github.com/maehr/awesome-digital-history/blob/main/CONTRIBUTING.md) for the process.
